{% extends 'base.html' %}

{% block title %}404 Not Found - HR Automation{% endblock %}

{% block content %}
<div class="row justify-content-center text-center py-5">
    <div class="col-md-6">
        <div class="empty-state border-0">
            <div class="display-1 fw-bold text-primary opacity-25 mb-2 font-monospace">404</div>
            <h3 class="fw-bold text-dark mb-2">Resource Not Located</h3>
            <p class="text-muted mb-4">The requested employee record, report file, or administrative route could not be found or has been safely archived.</p>
            <a href="{% url 'dashboard' %}" class="btn btn-primary px-4">
                <i class="bi bi-arrow-left me-1"></i> Return to Workspace Dashboard
            </a>
        </div>
    </div>
</div>
{% endblock %}
