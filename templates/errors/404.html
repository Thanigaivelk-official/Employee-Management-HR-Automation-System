{% extends 'base.html' %}

{% block title %}404 Not Found{% endblock %}

{% block content %}
<div class="row justify-content-center text-center py-5">
    <div class="col-md-6">
        <div class="display-1 fw-bold text-secondary mb-3">404</div>
        <h3 class="fw-bold text-dark">Resource Not Found</h3>
        <p class="text-muted">The requested employee record, document, or page could not be located in the HR automation database.</p>
        <a href="{% url 'dashboard' %}" class="btn btn-primary px-4 mt-3">
            <i class="bi bi-arrow-left me-1"></i> Return to Dashboard
        </a>
    </div>
</div>
{% endblock %}
